name: Release

# 只由打 tag 触发：`git tag v1.0.0 && git push origin v1.0.0`。
# 平时提交走 ci.yml（debug 构建 + 单测 + lint），这里只负责出正式包并挂到 Releases。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 同 ci.yml：默认的 "tools" 包已经不存在，必须显式指定，否则这一步直接挂
          packages: platform-tools

      - name: Install SDK platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # 签名密钥不进仓库：仓库只放 .local/keystore.properties 的「格式」，
      # 真正的 keystore 与口令来自仓库 Secrets（见 docs/02 §M9-4）。
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 Secrets.KEYSTORE_BASE64，无法出正式包"
            exit 1
          fi
          mkdir -p .local/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > .local/keystore/tinychat-release.jks
          printf 'storeFile=.local/keystore/tinychat-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > .local/keystore.properties

      - name: Assemble release
        run: ./gradlew --no-daemon assembleRelease lint

      - name: Verify signature
        run: |
          apksigner=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -r | head -1)
          chmod +x "$apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "TinyChat-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "TinyChat-${GITHUB_REF_NAME}.apk" \
            --title "TinyChat ${GITHUB_REF_NAME}" --generate-notes
